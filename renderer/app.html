<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, "system-ui", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #151517;
      color: #f9fafb;
      overflow: hidden;
      font-size: 16px;
    }
    .stage { position: absolute; inset: 0; }
    webview { width: 100%; height: 100%; }

    .overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #151517; z-index: 5;
    }
    .overlay[hidden] { display: none; }
    .overlay-card {
      background: #2c2c2e; border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 22px; padding: 28px 36px; max-width: 460px; text-align: center;
    }
    .overlay-card h1 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
    .overlay-card p { color: #cfd3d6; font-size: 14px; line-height: 1.5; margin: 0; }
    .overlay-card .row { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
    .btn {
      background: #43454a; border: 1px solid rgba(255, 255, 255, 0.12); color: #f9fafb;
      padding: 8px 16px; border-radius: 12px; cursor: pointer; font-size: 14px;
      font-family: inherit;
    }
    .btn:hover { background: #4b4d52; }
    .btn-accent { background: #679efe; border-color: transparent; color: #fff; }
    .btn-accent:hover { background: #7aaaff; }
    .spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: #679efe; border-radius: 50%;
      animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="stage">
    <webview id="webview"></webview>

    <div class="overlay" id="overlay-connecting">
      <div class="overlay-card">
        <p><span class="spinner"></span>Connecting to DeepSeek Harness&hellip;</p>
      </div>
    </div>

    <div class="overlay" id="overlay-offline" hidden>
      <div class="overlay-card">
        <h1>Backend offline</h1>
        <p>The DeepSeek Harness web backend (dsh web) isn&rsquo;t running. Start it here, or open the Control Center from the menu bar.</p>
        <div class="row">
          <button class="btn btn-accent" id="btn-backend-start">Start backend</button>
        </div>
        <p style="margin-top:14px; font-size:12.5px">It reconnects automatically when the backend comes back.</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
